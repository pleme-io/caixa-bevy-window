"[package]\nname = \"bevy_window\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Provides windowing functionality for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[features]\ndefault = [\"std\", \"bevy_reflect\"]\n\n# Functionality\n\n## Adds runtime reflection support using `bevy_reflect`.\nbevy_reflect = [\n  \"dep:bevy_reflect\",\n  \"bevy_app/bevy_reflect\",\n  \"bevy_ecs/bevy_reflect\",\n  \"bevy_input/bevy_reflect\",\n]\n\n## Adds serialization support through `serde`.\nserialize = [\"serde\", \"bevy_ecs/serialize\", \"bevy_input/serialize\"]\n\n# Enable custom cursor support\ncustom_cursor = [\"bevy_image\", \"bevy_asset\"]\n\n# Platform Compatibility\n\n## Allows access to the `std` crate. Enabling this feature will prevent compilation\n## on `no_std` targets, but provides access to certain additional features on\n## supported platforms.\nstd = [\n  \"bevy_app/std\",\n  \"bevy_ecs/std\",\n  \"bevy_input/std\",\n  \"bevy_math/std\",\n  \"bevy_reflect?/std\",\n  \"serde?/std\",\n  \"raw-window-handle/std\",\n  \"bevy_platform/std\",\n]\n\n## Uses the `libm` maths library instead of the one provided in `std` and `core`.\nlibm = [\"bevy_math/libm\"]\n\n[dependencies]\n# bevy\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\", default-features = false }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\", default-features = false }\nbevy_input = { path = \"../bevy_input\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"gestures\",\n  \"keyboard\",\n  \"mouse\",\n  \"touch\",\n] }\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\", default-features = false }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false }\n\n# bevy optional\nbevy_asset = { path = \"../bevy_asset\", version = \"0.19.0-dev\", default-features = false, optional = true }\nbevy_image = { path = \"../bevy_image\", version = \"0.19.0-dev\", optional = true }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"glam\",\n], optional = true }\n\n# other\nserde = { version = \"1.0\", features = [\n  \"alloc\",\n  \"derive\",\n], default-features = false, optional = true }\nraw-window-handle = { version = \"0.6\", features = [\n  \"alloc\",\n], default-features = false }\nlog = { version = \"0.4\", default-features = false }\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
